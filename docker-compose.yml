services:
  rag_backbone:
    container_name: rag-backbone
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8008:8008"
      - "8009:8009"
    environment:
      - ENVIRONMENT=deployment
      - API_PORT="8008"
      - MCP_PORT="8009" 
      - CHAT_MODE=false
      - VECTOR_DB_PROVIDER=qdrant
      - VECTOR_DB_API_KEY=EMPTY
      - VECTOR_DB_URL=http://qdrant:6333
      - EMBED_MODEL_PROVIDER=fastembed
      - EMBED_MODEL_NAME=BAAI/bge-small-en-v1.5
      - EMBED_MODEL_BASE=EMPTY
      - EMBED_DIMENSION=384
      - EMBED_MODEL_API_KEY=EMPTY
      - LLM_PROVIDER=custom
      - LLM_API_KEY=EMPTY
      - LLM_API_BASE=http://host.docker.internal:11434/v1
      - LLM_MODEL=qwen2.5:32b
      - LLM_TEMPERATURE=0.0
      - LANGFUSE_ENABLE=false
      - LANGFUSE_PUBLIC_KEY=None
      - LANGFUSE_SECRET_KEY=None
      - LANGFUSE_HOST=http://host.docker.internal:3000
      - PARSER_TYPE=marker
      - PARSER_URL=http://host.docker.internal:8008
      - ENABLE_QUERY_PREPROCESS=false
      - NUM_QUERIES=3
      - DENSE_TOP_K=5
      - SPARSE_TOP_K=5
      - FUSE_TOP_K=5
      - REPACK_STRATEGY=forward
    depends_on:
      - qdrant
    restart: always

  qdrant:
    container_name: qdrant
    image: qdrant/qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - ./qdrant_storage:/qdrant/storage:z
    restart: always
